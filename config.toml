[benchmark]
# Sightglass suite to run, relative to `sightglass/`.
suite = "benchmarks/default.suite"
# Callgrind processes per benchmark. Each is its own work unit.
processes = 3
# Pinned Cranelift ISA flags. x86-64-v3, the newest level Valgrind's synthetic
# CPU supports. An explicit `--target` disables native feature inference, so
# this is the complete set. See docs/architecture.md.
engine-flags = """--target x86_64-unknown-linux-gnu \
  -Ccranelift-has-sse3 -Ccranelift-has-ssse3 -Ccranelift-has-sse41 \
  -Ccranelift-has-sse42 -Ccranelift-has-popcnt -Ccranelift-has-avx \
  -Ccranelift-has-avx2 -Ccranelift-has-fma -Ccranelift-has-bmi1 \
  -Ccranelift-has-bmi2 -Ccranelift-has-lzcnt -Ccranelift-has-cmpxchg16b"""

[regressions]
# Significance level for the confidence interval: 0.01 is 99% confidence.
significance-level = 0.01
# Minimum relative change in mean virtual cycles to report, e.g. 0.01 is 1%.
# Calibrate during rollout.
min-relative-change = 0.01
# Repository regression issues are filed on. This repo during rollout, then
# bytecodealliance/wasmtime. See docs/regressions.md.
issue-repo = "bytecodealliance/are-we-fast-yet"

[site]
# Where `pages.yml` deploys the site. Regression issues link here.
base-url = "https://bytecodealliance.github.io/are-we-fast-yet/"
# This repository, for links to raw data on GitHub.
repo = "bytecodealliance/are-we-fast-yet"
