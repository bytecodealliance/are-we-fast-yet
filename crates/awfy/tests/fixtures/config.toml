[benchmark]
suite = "benchmarks/default.suite"
iterations = 6
engine-flags = "--target x86_64-unknown-linux-gnu -Ccranelift-has-avx2"

[regressions]
significance-level = 0.01
issue-repo = "bytecodealliance/are-we-fast-yet"
issue-labels = "performance,awfy"

[regressions.min-relative-change.compilation]
geomean = 0.02
individual = 0.01

[regressions.min-relative-change.instantiation]
geomean = 0.02
individual = 0.05

[regressions.min-relative-change.execution]
geomean = 0.002
individual = 0.01

[bisect]
# Callgrind iterations per side when bisecting a regression. Enough to tell
# "no change" from the detected regression, which the main run already showed
# to be significant. See docs/regressions.md.
iterations = 2
# A commit is blamed when its own change is at least this share of the
# detected change, in log terms.
blame-share = 0.25
# The blamed commits account for the regression when their changes sum to
# within this share of the detected change.
completeness-tolerance = 0.25

[site]
base-url = "https://bytecodealliance.github.io/are-we-fast-yet/"
repo = "bytecodealliance/are-we-fast-yet"
