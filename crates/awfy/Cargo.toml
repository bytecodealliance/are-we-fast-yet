[package]
name = "awfy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
env_logger = "0.11"
flate2 = "1"
jiff = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
sightglass-analysis = { path = "../../sightglass/crates/analysis" }
sightglass-data = { path = "../../sightglass/crates/data" }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
