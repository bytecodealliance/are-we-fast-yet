name: Pages

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to deploy. The caller's commit predates any data it just pushed.
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - site/**
      - crates/**
      - benchmark-data/excluded.toml
      - config.toml
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/rust-cache
      - run: cargo build --release -p awfy
      - run: target/release/awfy site --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # Re-runs keep earlier attempts' artifacts, and `deploy-pages` fails
          # if more than one artifact has the name it is looking for.
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
