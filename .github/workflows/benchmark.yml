name: Benchmark

on:
  schedule:
    # Every 15 minutes, off the round minutes that everyone else's cron jobs
    # crowd onto.
    #
    # A typical benchmark run takes longer than that, but only one runs at a
    # time, and new ones are queued. However, at most one pending job can be
    # queued at a time, and queuing a new job cancels the previously queued one,
    # so we don't need to worry about a ton of jobs queueing up.
    #
    # We run this frequently to try and keep regression ranges as narrow as
    # possible. When the Wasmtime commit hasn't changed, we don't run
    # benchmarks, so this doesn't unnecessarily waste a bunch of compute either.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if Wasmtime main is unchanged since the last run.
        type: boolean
        default: false
      dry-run:
        description: Upload the run and would-be issue as artifacts instead of pushing, filing, and deploying.
        type: boolean
        default: false
      suite:
        description: Suite to run instead of config.toml's, relative to sightglass/.
        type: string
        default: ""

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASMTIME_REPO: https://github.com/bytecodealliance/wasmtime

jobs:
  # Pick the commit and build everything once, so every shard measures
  # identical binaries.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      started: ${{ steps.check.outputs.started }}
      skip: ${{ steps.check.outputs.skip }}
      ref: ${{ steps.check.outputs.ref }}
    env:
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      # A queued run can start hours after its trigger, so check out the tip
      # rather than `github.sha`, which would miss the data pushed in the
      # meantime and reuse its run number.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - uses: ./.github/actions/rust-cache
        with:
          workspaces: |
            .
            sightglass

      # Only main may push data; test branches with dry-run.
      - name: Check branch
        if: env.DRY_RUN == 'false' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Non-dry runs must be on main, not $GITHUB_REF."
          exit 1

      - run: cargo build --release -p awfy

      - name: Check for a new Wasmtime commit
        id: check
        env:
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          sha=$(git ls-remote "$WASMTIME_REPO" refs/heads/main | cut -f1)
          latest=$(target/release/awfy latest wasmtime.commit)
          echo "wasmtime main is $sha; latest run measured ${latest:-nothing}"
          {
            echo "sha=$sha"
            echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$latest" ] && [ "$FORCE" != true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Wasmtime \`$sha\` was already benchmarked; skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Sightglass's build script fetches into BUILD_DIR's existing clone and
      # reuses its `target/`, so caching it makes successive builds
      # incremental.
      - name: Restore Wasmtime build
        if: steps.check.outputs.skip == 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wasmtime-build
          key: wasmtime-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.check.outputs.sha }}
          restore-keys: wasmtime-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Build engine
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/build-engine
        with:
          revision: ${{ steps.check.outputs.sha }}
          out: ${{ runner.temp }}/bin/engine

      - name: Build sightglass-cli
        if: steps.check.outputs.skip == 'false'
        run: |
          cargo build --release --manifest-path sightglass/Cargo.toml -p sightglass-cli
          cp target/release/awfy sightglass/target/release/sightglass-cli "$RUNNER_TEMP/bin/"

      - name: Upload binaries
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
          if-no-files-found: error
          retention-days: 7

  # One shard per job: shard k runs iterations k, k + 3, ... of every
  # benchmark, so each benchmark's samples come from several hosts. See
  # docs/architecture.md.
  measure:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      # `record` needs every shard, but a failed shard shouldn't cancel the
      # others' diagnostics.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SUITE: ${{ inputs.suite }}
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - name: Install Valgrind
        uses: ./.github/actions/install-valgrind

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin

      - name: awfy run
        run: |
          # Artifacts don't keep the executable bit.
          chmod +x "$RUNNER_TEMP/bin/awfy" "$RUNNER_TEMP/bin/sightglass-cli"
          "$RUNNER_TEMP/bin/awfy" run \
            --engine "$RUNNER_TEMP/bin/engine/libengine.so" \
            --sightglass-cli "$RUNNER_TEMP/bin/sightglass-cli" \
            --out "$RUNNER_TEMP/scratch" \
            --shard "$SHARD" \
            ${SUITE:+--suite "$SUITE"}

      # Also on failure, for each failed unit's full stderr.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scratch-${{ matrix.shard }}
          path: ${{ runner.temp }}/scratch
          if-no-files-found: error
          retention-days: 7

  record:
    needs: [prepare, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      # To start `bisect.yml`.
      actions: write
    outputs:
      run: ${{ steps.record.outputs.run }}
    env:
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
      SUITE: ${{ inputs.suite }}
    steps:
      # The commit the shards measured with, so the recorded config, suite,
      # and Sightglass commit are the ones measured.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: ./.github/actions/rust-cache

      - run: cargo build --release -p awfy

      # Treeless: enough for the commit date and the new commits' log.
      - name: Clone Wasmtime
        id: wasmtime
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git clone --filter=tree:0 --no-checkout "$WASMTIME_REPO" "$RUNNER_TEMP/wasmtime"
          echo "date=$(git -C "$RUNNER_TEMP/wasmtime" log -1 --format=%cI "$SHA")" >> "$GITHUB_OUTPUT"

      # For the Valgrind version `awfy record` records.
      - name: Install Valgrind
        uses: ./.github/actions/install-valgrind

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scratch-*
          path: ${{ runner.temp }}/scratch

      - name: awfy record
        id: record
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          DATE: ${{ steps.wasmtime.outputs.date }}
          STARTED: ${{ needs.prepare.outputs.started }}
        run: |
          scratch=()
          for dir in "$RUNNER_TEMP"/scratch/scratch-*; do
            scratch+=(--scratch "$dir")
          done
          run=$(target/release/awfy record \
            "${scratch[@]}" \
            --wasmtime-commit "$SHA" \
            --wasmtime-commit-date "$DATE" \
            --started "$STARTED" \
            --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --wasmtime-repo "$RUNNER_TEMP/wasmtime" \
            ${SUITE:+--suite "$SUITE"})
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: env.DRY_RUN == 'false'
        env:
          RUN: ${{ steps.record.outputs.run }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "benchmark-data/$RUN"
          git commit -m "Record run $RUN (wasmtime ${SHA:0:12})"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $attempt); rebasing"
            git pull --rebase origin main
          done
          exit 1

      - name: awfy regressions
        id: regressions
        env:
          RUN: ${{ steps.record.outputs.run }}
        run: |
          target/release/awfy regressions --run "$RUN" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --issue-dir "$RUNNER_TEMP/issue" \
            --wasmtime-repo "$RUNNER_TEMP/wasmtime"
          if [ -f "$RUNNER_TEMP/issue/title.txt" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # A dry run uploads the range issue a regression would have been
      # bisected from.
      - name: Upload dry-run results
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-${{ steps.record.outputs.run }}
          path: |
            benchmark-data/${{ steps.record.outputs.run }}
            ${{ runner.temp }}/issue
          if-no-files-found: error

      # The bisect files the issue, if it confirms the regression. Its own
      # workflow, so the next benchmark run doesn't wait for it.
      - name: Start bisect
        if: steps.regressions.outputs.found == 'true' && env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.record.outputs.run }}
        run: |
          gh workflow run bisect.yml --repo "$GITHUB_REPOSITORY" --ref main -f run="$RUN"
          echo "Regressions found; started a bisect of run $RUN." >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: record
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
